name: Archive exact source supplementary gates
on:
  push:
    branches:
      - validation/archive-gates-20261109
permissions:
  contents: read
jobs:
  archive-gates:
    if: github.repository == 'Afloat16/claude-mem'
    name: Archive 8 regression and archive L0 gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/craft-archive-target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Check out archive 8 exact source
        uses: actions/checkout@v4
        with:
          repository: Afloat16/craft-anything
          ref: de2c63908909cab675887103921ed2601b1bae9b
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Archive 8 formatting and regression tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p craft-anything-formats
          cargo clippy --locked -p craft-anything-formats --all-targets -- -D warnings
      - name: Archive 8 L0 gates
        run: |
          cargo run --locked -p xtask -- layers
          cargo run --locked -p xtask -- locks
          cargo run --locked -p xtask -- secrets
          cargo run --locked -p xtask -- wasm
          git diff --exit-code -- Cargo.lock
