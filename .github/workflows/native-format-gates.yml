name: Native parser L0 through L2 gates
on:
  push:
    branches:
      - validation/native-format-gates-20261109
permissions:
  contents: read
jobs:
  native-gates:
    if: github.repository == 'Afloat16/claude-mem'
    name: Native parser layer, lock, secret and WebAssembly checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/craft-anything
          ref: 14b61bb39ae47a4ab1a2b8488fee673a0a02a395
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: contribution-formats
          cache-on-failure: 'true'
      - name: Native 1 - import-library-slots
        if: always()
        run: |
          git fetch --no-tags --depth=1 origin 14b61bb39ae47a4ab1a2b8488fee673a0a02a395
          git checkout --detach --force 14b61bb39ae47a4ab1a2b8488fee673a0a02a395
          test "$(git rev-parse HEAD)" = "14b61bb39ae47a4ab1a2b8488fee673a0a02a395"
          cargo xtask layers
          cargo xtask locks
          cargo xtask secrets
          cargo xtask wasm
          git diff --exit-code -- Cargo.lock
      - name: Native 2 - elf-core-path-cursor
        if: always()
        run: |
          git fetch --no-tags --depth=1 origin 31727d965106c62e552d901be3f1e4710fc0030a
