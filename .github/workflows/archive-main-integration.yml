name: Archive main integration and tar installer review
on:
  push:
    branches:
      - validation/archive-main-integration-20261109
permissions:
  contents: read
jobs:
  archive-integration:
    if: github.repository == 'Afloat16/claude-mem'
    name: Nine archive heads merged with main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Keep sequential compilation outside checkout
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/archive-main-target" >> "$GITHUB_ENV"
      - name: Check out archive 1 integrated source
        if: always()
        uses: actions/checkout@v4
        with:
          repository: Afloat16/craft-anything
          ref: a574cde8b266b8a07f84b0ad70a809a08e8f4d95
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Archive 1 formatting
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "a574cde8b266b8a07f84b0ad70a809a08e8f4d95"
          cargo fmt --all -- --check
      - name: Archive 1 regression tests
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "a574cde8b266b8a07f84b0ad70a809a08e8f4d95"
          cargo test --locked -p craft-anything-formats --no-fail-fast
      - name: Archive 1 clippy
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "a574cde8b266b8a07f84b0ad70a809a08e8f4d95"
          cargo clippy --locked -p craft-anything-formats --all-targets -- -D warnings
      - name: Archive 1 L0 gates
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "a574cde8b266b8a07f84b0ad70a809a08e8f4d95"
          cargo run --locked -p xtask -- layers
          cargo run --locked -p xtask -- locks
          cargo run --locked -p xtask -- secrets
          cargo run --locked -p xtask -- wasm
          git diff --exit-code -- Cargo.lock
