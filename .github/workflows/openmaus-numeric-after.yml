name: OpenMaus numeric argument correction
on:
  push:
    branches:
      - validation/openmaus-numeric-after-20261109
permissions:
  contents: read
jobs:
  corrected:
    if: github.repository == 'Afloat16/claude-mem'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/OpenMausBot
          ref: 683d1fe6c6fd6a4827556dc3aee605ba91228c8c
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install declared dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Connector argument regressions and real proxy transport
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --environment node --maxWorkers=1 --no-file-parallelism server/connector-arguments.test.ts server/connector-proxy.test.ts --reporter=json --outputFile="$RUNNER_TEMP/numeric-after.json"
          result=$?
          set -e
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/numeric-after.json', 'utf8'));
          console.log(JSON.stringify({ source_sha: '683d1fe6c6fd6a4827556dc3aee605ba91228c8c', passed: report.numPassedTests, failed: report.numFailedTests, pending: report.numPendingTests, files: report.testResults.map(file => ({ name: file.name, status: file.status, tests: file.assertionResults.length })), failures: report.testResults.flatMap(file => file.assertionResults).filter(test => test.status === 'failed').map(test => ({ name: test.fullName, messages: test.failureMessages })) }, null, 2));
          NODE
          exit "$result"
      - name: Full project typecheck
        if: always()
        run: pnpm typecheck
      - name: Changed TypeScript lint
        if: always()
        run: pnpm exec oxlint --deny-warnings server/connector-arguments.ts server/connector-arguments.test.ts server/connector-proxy.test.ts
      - name: Official isolated server fixture and doctor
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { launchVerificationServer, runControlOmb } from './scripts/control-omb.ts';
          const fixture = await launchVerificationServer();
          const evidence = { source_sha: '683d1fe6c6fd6a4827556dc3aee605ba91228c8c', fixture: fixture.info, checks: [] };
          console.log(JSON.stringify({ fixture: fixture.info }));
          try {
            const doctor = await runControlOmb(['doctor', '--url', fixture.info.url]);
            evidence.doctor = doctor;
            assert.equal(doctor.ok, true);
            evidence.checks.push('official isolated fake-engine fixture doctor');
            console.log(JSON.stringify({ source_sha: '683d1fe6c6fd6a4827556dc3aee605ba91228c8c', doctor: 'passed' }));
          } finally {
            writeFileSync('numeric-fixture.json', JSON.stringify(evidence, null, 2) + '\n');
            await fixture.close();
          }
          NODE
      - name: Keep validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-after-683d1fe6c6fd6a4827556dc3aee605ba91228c8c
          path: |
            ${{ runner.temp }}/numeric-after.json
            numeric-fixture.json
            /tmp/openmausbot-verification-evidence/*.log
          if-no-files-found: ignore
